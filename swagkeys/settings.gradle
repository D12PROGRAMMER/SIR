pluginManagement {
    repositories {
        google()
        // Google-hosted mirror of Maven Central (repo.maven.apache.org rate-limits CI hosts).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = 'SwagKeys'
include ':app'
